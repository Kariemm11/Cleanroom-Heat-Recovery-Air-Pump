<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="IBM Plex Sans, Arial, Helvetica, sans-serif"><rect width="420" height="297" fill="#ffffff"/><rect x="5" y="5" width="410" height="287" fill="none" stroke="#111827" stroke-width="0.5"/><rect x="290" y="268" width="125" height="24" fill="#ffffff" stroke="#111827" stroke-width="0.4"/><text x="292.00" y="273.50" font-size="3.0" fill="#111827" text-anchor="start" font-weight="bold">Clean-room heat-recovery air-pump rig</text><text x="292.00" y="278.50" font-size="2.8" fill="#111827" text-anchor="start" font-weight="normal">Sheet 1 · Power distribution, fusing and current sensing</text><text x="292.00" y="283.50" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">ESP32-S3 controller · 24 V DC · pin map = firmware/include/config.h</text><text x="292.00" y="288.50" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">Sheet 1 of 2 · A3 · Eng. Kariem Moussa · GIU</text><text x="10.00" y="13.00" font-size="4.2" fill="#111827" text-anchor="start" font-weight="bold">POWER DISTRIBUTION</text><text x="10.00" y="18.50" font-size="2.4" fill="#4b5563" text-anchor="start" font-weight="normal">All loads run from one 24 V DC supply. Each branch has its own fuse; the three ACS712 current sensors measure the compressor, fan and heater branches (CT-101 … 103). The controls branch is not on a CT (≈3.5 W, added in firmware).</text><rect x="10.00" y="40.00" width="34.00" height="22.00" rx="0.8" fill="#f9fafb" stroke="#111827" stroke-width="0.3"/><text x="11.60" y="43.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">Mains 230 V AC</text><text x="11.60" y="46.60" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">L, N, PE</text><text x="11.60" y="49.30" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">IEC inlet + switch</text><text x="11.60" y="52.00" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">fuse 2 A T</text><polyline points="44.00,51.00 54.00,51.00" fill="none" stroke="#b91c1c" stroke-width="0.6"/><rect x="54.00" y="38.00" width="40.00" height="28.00" rx="0.8" fill="#fef2f2" stroke="#b91c1c" stroke-width="0.3"/><text x="55.60" y="41.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">PSU 24 V DC, 150 W</text><text x="55.60" y="44.60" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">6.25 A, enclosed</text><text x="55.60" y="47.30" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">e.g. 150 W DIN/chassis</text><text x="55.60" y="50.00" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">PE to the rig frame</text><polyline points="94.00,48.00 104.00,48.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="104.00" y="41.00" width="30.00" height="14.00" rx="0.8" fill="#ffffff" stroke="#111827" stroke-width="0.3"/><text x="105.60" y="44.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">Input protection</text><text x="105.60" y="47.60" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">TVS SMBJ28A</text><text x="105.60" y="50.30" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">470 µF 35 V bulk</text><polyline points="134.00,48.00 142.00,48.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="142.00" y="42.00" width="16.00" height="12.00" rx="0.8" fill="#fff7ed" stroke="#b91c1c" stroke-width="0.3"/><text x="143.60" y="45.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">F1 8 A</text><text x="143.60" y="48.60" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">main fuse</text><polyline points="158.00,48.00 170.00,48.00 170.00,240.00" fill="none" stroke="#b91c1c" stroke-width="1.0"/><text x="171.50" y="46.00" font-size="2.6" fill="#b91c1c" text-anchor="start" font-weight="bold">+24 V BUS</text><polyline points="94.00,58.00 100.00,58.00 100.00,226.00 150.00,226.00" fill="none" stroke="#111827" stroke-width="0.8"/><polyline points="150.00,223.00 150.00,229.00" fill="none" stroke="#111827" stroke-width="0.8"/><polyline points="152.00,224.50 152.00,227.50" fill="none" stroke="#111827" stroke-width="0.6"/><polyline points="154.00,225.50 154.00,226.50" fill="none" stroke="#111827" stroke-width="0.5"/><text x="102.00" y="223.50" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">0 V star point (PSU −): one return wire per branch</text><circle cx="170.00" cy="70.00" r="0.7" fill="#111827"/><polyline points="170.00,70.00 182.00,70.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="182.00" y="64.00" width="18.00" height="12.00" rx="0.8" fill="#fff7ed" stroke="#b91c1c" stroke-width="0.3"/><text x="183.60" y="67.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">F2 3 A T</text><polyline points="200.00,70.00 210.00,70.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="210.00" y="63.00" width="34.00" height="14.00" rx="0.8" fill="#eff6ff" stroke="#0369a1" stroke-width="0.3"/><text x="211.60" y="66.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">CT-101</text><text x="211.60" y="69.60" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">ACS712-05B · GPIO4</text><text x="211.60" y="72.30" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">Hall sensor in series</text><polyline points="244.00,70.00 252.00,70.00 252.00,70.00 262.00,70.00" fill="none" stroke="#b91c1c" stroke-width="0.6"/><rect x="262.00" y="64.00" width="118.00" height="13.00" rx="0.8" fill="#ffffff" stroke="#111827" stroke-width="0.3"/><text x="263.60" y="67.40" font-size="2.4" fill="#111827" text-anchor="start" font-weight="bold">J6 CMP-101 compressor driver</text><text x="263.60" y="70.40" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">24 V, 0 V, SPEED 0–5 V (from LM358)</text><text x="263.60" y="73.00" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">≈35 W; driver limits the start current</text><circle cx="170.00" cy="110.00" r="0.7" fill="#111827"/><polyline points="170.00,110.00 182.00,110.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="182.00" y="104.00" width="18.00" height="12.00" rx="0.8" fill="#fff7ed" stroke="#b91c1c" stroke-width="0.3"/><text x="183.60" y="107.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">F3 3.15 A</text><polyline points="200.00,110.00 210.00,110.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="210.00" y="103.00" width="34.00" height="14.00" rx="0.8" fill="#eff6ff" stroke="#0369a1" stroke-width="0.3"/><text x="211.60" y="106.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">CT-103</text><text x="211.60" y="109.60" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">ACS712-05B · GPIO6</text><text x="211.60" y="112.30" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">Hall sensor in series</text><polyline points="244.00,110.00 252.00,110.00 252.00,110.00 262.00,110.00" fill="none" stroke="#b91c1c" stroke-width="0.6"/><rect x="262.00" y="104.00" width="118.00" height="13.00" rx="0.8" fill="#ffffff" stroke="#111827" stroke-width="0.3"/><text x="263.60" y="107.40" font-size="2.4" fill="#111827" text-anchor="start" font-weight="bold">J9 HTR-101 PTC 30 W</text><text x="263.60" y="110.40" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">24 V → thermal fuse 130 °C → PTC → MOSFET (GPIO47)</text><polyline points="244.00,110.00 252.00,110.00 252.00,126.00 262.00,126.00" fill="none" stroke="#b91c1c" stroke-width="0.6"/><rect x="262.00" y="120.00" width="118.00" height="13.00" rx="0.8" fill="#ffffff" stroke="#111827" stroke-width="0.3"/><text x="263.60" y="123.40" font-size="2.4" fill="#111827" text-anchor="start" font-weight="bold">J10 HUM-101 steam humidifier 34 W</text><text x="263.60" y="126.40" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">24 V → heater → MOSFET (GPIO48)</text><circle cx="170.00" cy="160.00" r="0.7" fill="#111827"/><polyline points="170.00,160.00 182.00,160.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="182.00" y="154.00" width="18.00" height="12.00" rx="0.8" fill="#fff7ed" stroke="#b91c1c" stroke-width="0.3"/><text x="183.60" y="157.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">F4 2 A</text><polyline points="200.00,160.00 210.00,160.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="210.00" y="153.00" width="34.00" height="14.00" rx="0.8" fill="#eff6ff" stroke="#0369a1" stroke-width="0.3"/><text x="211.60" y="156.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">CT-102</text><text x="211.60" y="159.60" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">ACS712-05B · GPIO5</text><text x="211.60" y="162.30" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">Hall sensor in series</text><polyline points="244.00,160.00 252.00,160.00 252.00,160.00 262.00,160.00" fill="none" stroke="#b91c1c" stroke-width="0.6"/><rect x="262.00" y="154.00" width="118.00" height="13.00" rx="0.8" fill="#ffffff" stroke="#111827" stroke-width="0.3"/><text x="263.60" y="157.40" font-size="2.4" fill="#111827" text-anchor="start" font-weight="bold">J2 FAN-101 · J3 FAN-102 · J4 FAN-103/103B</text><text x="263.60" y="160.40" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">J4 24 V via DV-101 end switch (NO FAN-103, NC FAN-103B)</text><text x="263.60" y="163.00" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">J5 DV-101 actuator 24 V (MOSFET GPIO21 + SS34)</text><circle cx="170.00" cy="205.00" r="0.7" fill="#111827"/><polyline points="170.00,205.00 182.00,205.00" fill="none" stroke="#b91c1c" stroke-width="0.7"/><rect x="182.00" y="199.00" width="18.00" height="12.00" rx="0.8" fill="#fff7ed" stroke="#b91c1c" stroke-width="0.3"/><text x="183.60" y="202.40" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">F5 2 A</text><text x="203.00" y="203.00" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal" font-style="italic">controls branch (not on a CT)</text><polyline points="200.00,205.00 208.00,205.00 208.00,205.00 262.00,205.00" fill="none" stroke="#b91c1c" stroke-width="0.6"/><rect x="262.00" y="199.00" width="118.00" height="13.00" rx="0.8" fill="#ffffff" stroke="#111827" stroke-width="0.3"/><text x="263.60" y="202.40" font-size="2.4" fill="#111827" text-anchor="start" font-weight="bold">Buck 24 → 5 V, 3 A</text><text x="263.60" y="205.40" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">5 V: ESP32-S3 5V pin, J21 HMI 7",</text><text x="263.60" y="208.00" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">ACS712 ×3, J20 SPS30 ×2, J24 SPS30 (PT-102)</text><polyline points="200.00,205.00 208.00,205.00 208.00,221.00 262.00,221.00" fill="none" stroke="#b91c1c" stroke-width="0.6"/><rect x="262.00" y="215.00" width="118.00" height="13.00" rx="0.8" fill="#ffffff" stroke="#111827" stroke-width="0.3"/><text x="263.60" y="218.40" font-size="2.4" fill="#111827" text-anchor="start" font-weight="bold">24 V small loads</text><text x="263.60" y="221.40" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">J11/J12 D6F flow ×2 · J8 DRV8825 VMOT (EEV)</text><text x="263.60" y="224.00" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">J7 RV-101 4-way valve coil (MOSFET GPIO42 + SS34)</text><polyline points="200.00,205.00 208.00,205.00 208.00,237.00 262.00,237.00" fill="none" stroke="#b91c1c" stroke-width="0.6"/><rect x="262.00" y="231.00" width="118.00" height="13.00" rx="0.8" fill="#ffffff" stroke="#111827" stroke-width="0.3"/><text x="263.60" y="234.40" font-size="2.4" fill="#111827" text-anchor="start" font-weight="bold">3.3 V from the ESP32-S3 regulator</text><text x="263.60" y="237.40" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">TCA9548A, SHT31 ×3, SDP810 ×2, DS18B20 ×5,</text><text x="263.60" y="240.00" font-size="2.1" fill="#4b5563" text-anchor="start" font-weight="normal">pull-ups (≈ 60 mA)</text><text x="10.00" y="238.00" font-size="2.8" fill="#111827" text-anchor="start" font-weight="bold">Notes</text><text x="10.00" y="243.00" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">• Wire: PSU → board 1.0 mm²; compressor, PTC, humidifier 0.5 mm²; fans and sensors 0.14–0.25 mm² or the FR4 strips.</text><text x="10.00" y="247.20" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">• PCB tracks (IPC-2221, 1 oz, 10 °C rise): 24 V bus ≥ 2.5 mm; compressor/PTC ≥ 1.0 mm; fans 0.4 mm; signals 0.25 mm.</text><text x="10.00" y="251.40" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">• Inductive loads (RV coil) need a flyback diode; the PTC and the humidifier heater are resistive.</text><text x="10.00" y="255.60" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">• MOSFET low-side switches: logic-level N-MOSFETs (AOD4184 / IRLZ44N), 100 Ω gate resistor, 100 k gate pull-down.</text><text x="10.00" y="259.80" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">• No PCB connection to the receiver, accumulator, filter-drier, sight glass or charging ports (mechanical refrigerant parts).</text><text x="10.00" y="75.00" font-size="2.6" fill="#111827" text-anchor="start" font-weight="bold">Legend</text><polyline points="10.00,78.20 18.00,78.20" fill="none" stroke="#b91c1c" stroke-width="0.6"/><text x="20.00" y="79.00" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">24 V / 5 V supply</text><polyline points="10.00,82.20 18.00,82.20" fill="none" stroke="#111827" stroke-width="0.6"/><text x="20.00" y="83.00" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">0 V</text><polyline points="10.00,86.20 18.00,86.20" fill="none" stroke="#0369a1" stroke-width="0.6"/><text x="20.00" y="87.00" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">sensor signal (to ESP32)</text><polyline points="10.00,90.20 18.00,90.20" fill="none" stroke="#b45309" stroke-width="0.6"/><text x="20.00" y="91.00" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">drive signal (from ESP32)</text><polyline points="10.00,94.20 18.00,94.20" fill="none" stroke="#047857" stroke-width="0.6"/><text x="20.00" y="95.00" font-size="2.2" fill="#4b5563" text-anchor="start" font-weight="normal">I²C / 1-Wire / UART bus</text></svg>
