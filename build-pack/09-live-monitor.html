<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rig Live Monitor</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--dim:#5b6675;--line:#d6dde5;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--acc:#0369a1}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#121922;--ink:#e6edf3;--dim:#8b9bab;--line:#253140;--ok:#3ccf7a;--warn:#f0a630;--bad:#ff6b6b;--acc:#49aeff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0}
h1{font-size:17px;margin:0 12px 0 0}button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#st{color:var(--dim)}main{padding:16px;display:grid;gap:14px;max-width:1300px;margin:0 auto}
.k{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.t{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.t .n{font-size:11px;color:var(--dim)}.t .v{font:600 20px ui-monospace,monospace}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}h2{font-size:13px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:3px 4px;border-bottom:1px solid var(--line)}td.v{text-align:right;font-family:ui-monospace,monospace}
.al{color:var(--bad);font-weight:600}.ok{color:var(--ok)}form{display:flex;gap:6px}form input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#log{height:150px;overflow:auto;font:12px ui-monospace,monospace;color:var(--dim);white-space:pre-wrap}
canvas{width:100%;height:140px}
</style>
</head>
<body>
<header>
  <h1>Clean-room rig · live monitor</h1>
  <button class="pri" id="conn">Connect to the rig (USB)</button>
  <button id="rec" disabled>Start CSV recording</button>
  <span id="st">Chrome or Edge on a laptop: plug in the ESP32-S3 USB port, then Connect.</span>
</header>
<main>
  <div class="k" id="kpis"></div>
  <div class="grid">
    <section><h2>Sensors</h2><table id="sens"></table></section>
    <section><h2>Outputs and status</h2><table id="outs"></table><p id="alarms" class="ok">no alarms</p></section>
    <section><h2>Trends (last 10 min)</h2><canvas id="chT" width="760" height="280"></canvas><canvas id="chP" width="760" height="280"></canvas></section>
    <section><h2>Commands</h2>
      <form id="cmdf"><input id="cmd" placeholder="e.g. SET flow 6.0 · MODE summer · MAN L3 30 · RESET energy · HELP" autocomplete="off"><button class="pri">Send</button></form>
      <div id="log"></div></section>
  </div>
</main>
<script>
"use strict";
var port=null, writer=null, last=null, hist=[], rec=null, $=function(s){return document.getElementById(s);};
var LABEL={TT101:"Fresh air °C",MT101:"Fresh air %RH",FT101:"Fresh-air flow m³/h",TT102:"Mixed air °C",TT103:"After pre-heat °C",TT104:"Off cooling coil °C",
 TT105:"Supply °C",MT105:"Supply %RH",FT102:"Supply flow m³/h",PDT101:"Room pressure Pa",PDT102:"HEPA ΔP Pa",TT106:"Room °C",MT106:"Room %RH",
 TT107:"Return °C",TT108:"Exhaust °C",CT101:"Compressor A",CT102:"Fans A",CT103:"PTC + humidifier A",VT101:"Bus V",PT101:"Room ≥0.5 µm /m³",
 PT101R5:"Room ≥5 µm /m³",PT101A:"Fill point ≥0.5 µm /m³",PT101A5:"Fill point ≥5 µm /m³",RPM101:"FAN-101 rpm",RPM102:"FAN-102 rpm",RPM103:"FAN-103 rpm"};
var OUT={fa:"FAN-101 fresh air",sf:"FAN-102 supply",ef:"FAN-103 exhaust",dmp:"SV-101 damper",cmp:"CMP-101 compressor",rh:"HTR-101 PTC",hum:"HUM-101 humidifier"};
function fmt(v,d){return v==null||isNaN(v)?"—":Number(v).toFixed(d);}
function log(s){var l=$("log");l.textContent+=s+"\n";l.scrollTop=l.scrollHeight;}
function render(j){
  var k=j.k||{}, s=j.s||{}, u=j.u||{};
  var tiles=[["ACH",fmt(k.ach,1)+" /h"],["Room pressure",fmt(s.PDT101,1)+" Pa"],["Supply",fmt(s.FT102,2)+" m³/h"],["Room",fmt(s.TT106,1)+" °C · "+fmt(s.MT106,0)+" %"],
    ["Power",fmt(k.P,1)+" W"],["Baseline twin",fmt(k.Pb,1)+" W"],["Saving",fmt((k.sav||0)*100,0)+" %"],["CO₂",fmt(k.co2h,1)+" g/h"],
    ["Energy",fmt(k.Ewh,1)+" / "+fmt(k.Ewhb,1)+" Wh"],["Particles",(k.room||"-")+" room · "+(k.fill||"-")+" fill"],["Mode",(j.mode||"")+(j.rec?" · recovery":" · baseline")+(j.on?"":" · OFF")]];
  $("kpis").innerHTML=tiles.map(function(t){return '<div class="t"><div class="n">'+t[0]+'</div><div class="v">'+t[1]+'</div></div>';}).join("");
  $("sens").innerHTML=Object.keys(LABEL).map(function(key){var d=/^PT/.test(key)||/^RPM/.test(key)?0:(/^CT/.test(key)?3:(/^MT/.test(key)?0:2));return "<tr><td>"+key+"</td><td>"+LABEL[key]+'</td><td class="v">'+fmt(s[key],d)+"</td></tr>";}).join("");
  $("outs").innerHTML=Object.keys(OUT).map(function(key,i){return "<tr><td>"+OUT[key]+'</td><td class="v">'+fmt((u[key]||0)*100,0)+" %"+(j.man&&j.man[["sf","fa","dmp","cmp","rh","hum","ef"].indexOf(key)]?" (manual)":"")+"</td></tr>";}).join("")+
    "<tr><td>EEV-101</td><td class=\"v\">"+fmt(u.eev,0)+" steps</td></tr><tr><td>RV-101</td><td class=\"v\">"+(u.rv?"cooling":"heating")+"</td></tr>";
  var al=j.al||[]; $("alarms").className=al.length?"al":"ok"; $("alarms").textContent=al.length?"Alarms: "+al.join(", "):"no alarms";
}
function chart(id,series,unit){
  var c=$(id),g=c.getContext("2d"),W=c.width,H=c.height,cs=getComputedStyle(document.documentElement);
  g.clearRect(0,0,W,H); if(hist.length<2) return;
  var vals=[];series.forEach(function(sr){hist.forEach(function(h){var v=sr[1](h);if(v!=null&&!isNaN(v))vals.push(v);});});
  if(!vals.length) return; var lo=Math.min.apply(0,vals),hi=Math.max.apply(0,vals); if(hi-lo<1){hi+=0.5;lo-=0.5;}
  g.font="20px ui-monospace,monospace"; g.fillStyle=cs.getPropertyValue("--dim"); g.fillText(hi.toFixed(1)+" "+unit,6,22); g.fillText(lo.toFixed(1),6,H-8);
  series.forEach(function(sr,i){g.strokeStyle=sr[2];g.lineWidth=3;g.beginPath();hist.forEach(function(h,k){var v=sr[1](h);if(v==null||isNaN(v))return;var x=k/(hist.length-1)*W,y=H-12-(v-lo)/(hi-lo)*(H-40);k?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
    g.fillStyle=sr[2];g.fillText(sr[0],W-260,24+i*24);});
}
async function connect(){
  if(!("serial" in navigator)){ $("st").textContent="Web Serial is not available: use Chrome or Edge on a desktop."; return; }
  port=await navigator.serial.requestPort(); await port.open({baudRate:115200});
  writer=port.writable.getWriter(); $("st").textContent="connected"; $("rec").disabled=false; $("conn").disabled=true;
  var dec=new TextDecoderStream(); port.readable.pipeTo(dec.writable); var rd=dec.readable.getReader(), buf="";
  for(;;){ var r=await rd.read(); if(r.done) break; buf+=r.value; var lines=buf.split("\n"); buf=lines.pop();
    lines.forEach(function(l){ l=l.trim(); if(!l) return;
      if(l[0]==="{"){ try{ last=JSON.parse(l); hist.push(last); if(hist.length>600) hist.shift(); render(last);
          chart("chT",[["Supply °C",function(h){return h.s.TT105;},"#e11d48"],["Room °C",function(h){return h.s.TT106;},"#2563eb"],["Mixed °C",function(h){return h.s.TT102;},"#16a34a"]],"°C");
          chart("chP",[["Power W",function(h){return h.k.P;},"#0f9c86"],["Baseline W",function(h){return h.k.Pb;},"#dd6a14"]],"W");
          if(rec) rec.push(csvRow(last)); }catch(e){ log(l); } }
      else log(l); }); }
}
var KEYS=null;
function csvRow(j){ if(!KEYS) KEYS=["t","mode","rec"].concat(Object.keys(j.s).map(function(k){return "s."+k;}),Object.keys(j.u).map(function(k){return "u."+k;}),Object.keys(j.k).map(function(k){return "k."+k;}));
  return KEYS.map(function(k){var p=k.split("."),v=p.length>1?j[p[0]][p[1]]:j[k];return v==null?"":v;}).join(","); }
$("conn").onclick=function(){ connect().catch(function(e){ $("st").textContent="connection failed: "+e.message; }); };
$("rec").onclick=function(){ if(!rec){ rec=[]; KEYS=null; this.textContent="Stop and save CSV"; return; }
  var head=KEYS?KEYS.join(","):"", blob=new Blob([head+"\n"+rec.join("\n")],{type:"text/csv"}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="rig-log-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".csv"; a.click(); rec=null; this.textContent="Start CSV recording"; };
$("cmdf").onsubmit=async function(e){ e.preventDefault(); var v=$("cmd").value.trim(); if(!v||!writer) return; await writer.write(new TextEncoder().encode(v+"\n")); log("> "+v); $("cmd").value=""; };
</script>
</body>
</html>
