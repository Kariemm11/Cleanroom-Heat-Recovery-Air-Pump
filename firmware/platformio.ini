; Clean-room heat-recovery air-pump rig controller (ESP32-S3-DevKitC-1, N8 or N8R8)
; Build and flash:  pio run -t upload    Serial monitor:  pio device monitor
[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1          ; Serial = native USB
    -Wall
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Host unit tests of the control logic (no hardware): see test/README.md
